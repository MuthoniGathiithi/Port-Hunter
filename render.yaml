services:
  - type: web
    name: identifacey-face
    runtime: python
    buildCommand: pip install -r requirements.txt && python -c "from insightface.app import FaceAnalysis; app=FaceAnalysis(name='buffalo_l',providers=['CPUExecutionProvider']); app.prepare(ctx_id=0)"
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8